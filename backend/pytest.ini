[pytest]
testpaths = tests
# `python -m pytest` puts the CWD on sys.path, the bare `pytest` console script
# does not — so without this the suite passes locally and fails in CI on
# `import app`. Setting it here makes both invocations equivalent.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: requires a live PostgreSQL instance
