name: CI

# Until now the only check on a pull request was Vercel's preview build, which
# compiles the frontend and says nothing about whether anything works. This runs
# both suites.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: btcquant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The integration tests need a real PostgreSQL; they never touch an
      # exchange, running against the synthetic adapter instead.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/btcquant_test
      ADMIN_API_KEY: ci-admin-key
      EXCHANGES: synthetic
      ALLOW_SYNTHETIC_SOURCE: "true"
      MIN_WARMUP_SECONDS: "0"
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Tests
        working-directory: backend
        run: pytest -q --durations=10

  frontend:
    name: Frontend (vitest, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
